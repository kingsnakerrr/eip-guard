services:
  # 主程序：跑在一台能长期在线的机器上（墙内墙外都行，只要有 Telegram）
  eipguard:
    build: .
    container_name: eipguard
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai

  # 可选：把探针也跑在容器里。
  # 需要分别在国内、国外各起一个，ZONE 对应实际位置。
  probe-cn:
    image: python:3.12-slim
    container_name: eip-probe-cn
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./probe_agent:/app
    environment:
      - ZONE=cn
      - PROBE_TOKEN=${PROBE_AGENT_TOKEN}
      - PROBE_PORT=8787
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq iputils-ping >/dev/null &&
             pip install --no-cache-dir aiohttp &&
             python server.py --port 8787"
    ports:
      - "8787:8787"
    profiles: ["probe-cn"]

  probe-os:
    image: python:3.12-slim
    container_name: eip-probe-os
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./probe_agent:/app
    environment:
      - ZONE=overseas
      - PROBE_TOKEN=${PROBE_AGENT_TOKEN}
      - PROBE_PORT=8787
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq iputils-ping >/dev/null &&
             pip install --no-cache-dir aiohttp &&
             python server.py --port 8787"
    ports:
      - "8787:8787"
    profiles: ["probe-os"]
