# EIP Guard 配置文件。复制为 config.yaml 后修改。
# ${VAR} 会被 .env / 环境变量替换；${VAR:-默认值} 支持默认值。

telegram:
  token: "${TG_BOT_TOKEN}"
  # 管理员 chat id（数字）。留空则用 /bind <口令> 绑定第一个管理员
  admin_chat_ids: "${TG_ADMIN_IDS:-}"
  # 首次绑定的口令（防止别人抢先绑定）。绑定后建议删掉
  bind_token: "${TG_BIND_TOKEN:-}"
  # 通知频道；运行时可用 /channel 覆盖
  channel_id: "${TG_CHANNEL_ID:-}"

aliyun:
  access_key_id: "${ALIYUN_AK_ID}"
  access_key_secret: "${ALIYUN_AK_SECRET}"
  # 默认地域，target 里可单独覆盖
  region_id: "cn-hongkong"
  endpoint: "vpc.aliyuncs.com"
  api_version: "2016-04-28"

# 日志时区，只影响消息里的时间显示
timezone: "Asia/Shanghai"
data_dir: "./data"
log_level: "INFO"

cloudflare:
  api_token: "${CF_API_TOKEN}"
  # zone_id 与 zone_name 二选一；填 name 会自动查询 zone id
  zone_id: ""
  zone_name: "example.com"
  # 记录 TTL（秒），建议 60 以便被墙后快速生效；1 = 自动
  ttl: 60
  # 是否开启 Cloudflare 小黄云。如果换 IP 是为了直连（不走 CF），请设 false
  proxied: false
  # 记录不存在时自动创建
  create_missing: true

detect:
  # 检测方式：probe_agent（自建境外探针，最可靠）/ checkhost（免费公共 API）/ hybrid
  provider: "probe_agent"
  # 默认探测端口，target 可覆盖
  port: 443
  # 多少秒检查一轮
  interval: 60
  # 连续多少轮判定为被墙才动作（防抖）
  failure_threshold: 3
  # 单次探测：判定“被墙”所需的失败样本占比，以及最少样本数
  fail_ratio: 0.6
  min_samples: 2
  timeout: 6.0
  # 更换后验证
  verify_delay: 20
  verify_attempts: 3
  verify_success_needed: 1

  probe_agent:
    # 可写多个，逗号分隔，每个都是一台境外 VPS
    urls: "${PROBE_AGENT_URL}"
    token: "${PROBE_AGENT_TOKEN}"
    # 每个节点发起几次 TCP 连接
    attempts: 3

  checkhost:
    max_nodes: 6
    timeout: 20

switch:
  # 是否自动更换；机器人里也能开关
  auto: true
  # 一次被墙事件最多尝试几个新 IP
  max_attempts: 3
  # 两次更换之间的最小间隔（秒），避免抖动
  cooldown: 900
  # 成功后释放旧 EIP（省钱；设 false 会继续收未绑定 EIP 的费用）
  release_old: true
  # 全部尝试失败时，把旧 EIP 重新绑回去（旧 IP 已墙，仅保证控制面可操作）
  restore_old_on_failure: true
  # 新 EIP 分配参数：留空表示沿用旧 EIP 的计费方式和带宽
  internet_charge_type: ""     # PayByTraffic / PayByBandwidth
  bandwidth_mbps: null         # 例如 100
  # 分配时尽量指定线路，留空用 BGP
  isp: ""

targets:
  - name: "hk-main"
    instance_id: "i-j6cxxxxxxxxxxxxxxxx"
    # 可选：不填会自动按实例查找绑定中的 EIP
    eip_allocation_id: "eip-j6cxxxxxxxxxxxxxxxx"
    # 可选：单独指定地域
    # region_id: "cn-hongkong"
    # 探测端口；不填用 detect.port
    probe_port: 443
    # 需要跟随新 IP 的域名记录（相对 zone 或完整域名均可）
    dns_records:
      - "hk.example.com"
      - "api.example.com"
    notes: "香港主站"
