# EIP Guard 配置文件。复制为 config.yaml 后修改。
# 也可以只填 telegram.token，其余全部在 Telegram 里用命令添加。
# ${VAR} 会被 .env / 环境变量替换。

telegram:
  token: "${TG_BOT_TOKEN}"
  # 管理员 chat id（数字，逗号分隔）。第一次用可以在服务器执行：
  #   eipguard bind 你的chatid
  # 或启动后私聊机器人发 /bind 口令
  admin_chat_ids: "${TG_ADMIN_IDS:-}"
  # /bind 用的口令（可空）
  bind_token: "${TG_BIND_TOKEN:-}"
  # 通知频道；也可以之后在 TG 里 /channel -100xxxxxxxxxx
  channel_id: "${TG_CHANNEL_ID:-}"
  # 服务器连不上 Telegram 时的代理（国内机器必填），例如 socks5://127.0.0.1:1080
  proxy: "${TG_PROXY:-}"

# ---------------- 阿里云账号（多账号）----------------
# 也可以完全留空，之后在 TG 里 /account add 添加。
# 建议每个账号用 RAM 子账号，只给 EIP 权限（见 docs/aliyun-ram-policy.json）。
aliyun:
  accounts: []
  # 示例：
  # accounts:
  #   - name: "main"
  #     access_key_id: "${ALIYUN_AK_ID}"
  #     access_key_secret: "${ALIYUN_AK_SECRET}"
  #     region: "cn-hongkong"

# ---------------- Cloudflare ----------------
# 也可以留空，之后在 TG 里 /cf TOKEN 域名
cloudflare:
  api_token: "${CF_API_TOKEN:-}"
  zone_name: "${CF_ZONE_NAME:-}"     # 例如 example.com
  zone_id: ""                        # 填了 zone_name 会自动查
  ttl: 60                            # 秒，建议 60 让新 IP 尽快生效
  proxied: false                     # 换 IP 直连就 false；开小黄云则 true
  create_missing: true               # 记录不存在时自动创建
  multi_record_policy: replace       # replace=所有 A 记录都改；keep=只改第一条

# ---------------- 换 IP 行为 ----------------
switch:
  # 换完是否释放旧 EIP（停止计费）。强烈建议 true。
  release_old: true
  # 分配新 EIP 失败时重试几次
  max_attempts: 3
  # 留空 = 沿用阿里云默认（按流量计费）
  internet_charge_type: ""
  bandwidth_mbps: null
  isp: ""

# ---------------- 实例（也可以之后 /target add）----------------
targets: []
# 示例：
# targets:
#   - name: "hk-main"
#     account: "main"
#     instance_id: "i-j6cxxxxxxxxxxxxxxxx"
#     dns_records: ["hk.example.com", "api.example.com"]
#     notes: "香港主站"

timezone: "Asia/Shanghai"
data_dir: "./data"
log_level: "INFO"
